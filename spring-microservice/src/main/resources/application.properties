# ═══════════════════════════════════════════════════════════════
# H2 Embedded Database (local development fallback)
# Switch to Supabase PostgreSQL in production by uncommenting below
# ═══════════════════════════════════════════════════════════════

# --- H2 In-Memory (active) ---
spring.datasource.url=jdbc:h2:mem:solardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=never

# --- Supabase PostgreSQL (uncomment when Supabase is ready) ---
# spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
# spring.datasource.username=postgres.osrxhtcgtlmjghgkdkte
# spring.datasource.password=Amarlogiclabs@12
# spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8081

# CORS
server.servlet.context-path=/

# Logging
logging.level.com.solar=INFO
