name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # Only rebuild when frontend source or workflow changes
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.PUBLIC_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ROUTER_MODE: hash
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        run: npm run build

      - name: Post-build setup
        working-directory: frontend
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        run: |
          # SPA fallback: serve index.html for all 404 routes
          cp dist/index.html dist/404.html
          # Prevent Jekyll processing
          touch dist/.nojekyll
          # Runtime API config — reads the secret at build time and bakes it in
          # If PUBLIC_API_URL secret is not set, API_BASE will be "" and the app
          # will show a "no backend configured" warning on the login screen.
          python3 -c '
          import json, os
          url = os.environ.get("PUBLIC_API_URL") or ""
          print(f"window.__API_BASE__ = {json.dumps(url)};")
          ' > dist/config.js

      - name: Inject config.js into index.html (if not already present)
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', '404.html'):
              p = Path(f'dist/{name}')
              html = p.read_text()
              tag = '<script src="./config.js"></script>'
              if tag not in html:
                  html = html.replace('<head>', '<head>\n  ' + tag, 1)
                  p.write_text(html)
          PY

      - name: Verify dist contents
        working-directory: frontend
        run: |
          echo "=== dist/index.html asset references ==="
          grep -E "script|stylesheet|config" dist/index.html
          echo "=== dist/config.js ==="
          cat dist/config.js
          echo "=== dist/ file count ==="
          find dist -type f | wc -l

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
