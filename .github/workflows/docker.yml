name: Docker Build & Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write .env file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          {
            echo "NODE_ENV=production"
            echo "PORT=5001"
            echo "REQUIRE_DATABASE=false"
            echo "SPRING_PROFILES_ACTIVE=docker"
            [ -n "$JWT_SECRET" ] && echo "JWT_SECRET=$JWT_SECRET"
            [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL=$SUPABASE_URL"
            [ -n "$SUPABASE_KEY" ] && echo "SUPABASE_KEY=$SUPABASE_KEY"
            [ -n "$SUPABASE_SERVICE_KEY" ] && echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY"
            [ -n "$DATABASE_URL" ] && echo "DATABASE_URL=$DATABASE_URL"
            [ -n "$SPRING_DATASOURCE_URL" ] && echo "SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL"
            [ -n "$SPRING_DATASOURCE_USERNAME" ] && echo "SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME"
            [ -n "$SPRING_DATASOURCE_PASSWORD" ] && echo "SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD"
          } > .env

      - name: Build all Docker images
        run: docker compose build

      # Wait only on the billing path (frontend + Node + nginx). Spring is optional
      # and must not fail Pages/deploy when datasource secrets are unset.
      - name: Start services and wait for health
        run: docker compose up -d --wait --wait-timeout 180 frontend node-backend nginx

      - name: Verify health endpoints
        run: |
          echo "=== Nginx ==="
          curl -f http://localhost/nginx-health
          echo ""
          echo "=== Node BFF ==="
          curl -f http://localhost/api/health
          echo ""
          echo "=== Frontend SPA ==="
          curl -f http://localhost | head -20
          echo ""
          echo "=== Spring Boot (optional) ==="
          curl -f http://localhost/spring/health || echo "Spring not healthy yet (non-blocking for billing API)"

      - name: Container status
        if: always()
        run: docker compose ps

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/solar-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push node-backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: node-backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/solar-node-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push spring-service image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./spring-microservice
          push: true
          tags: ghcr.io/${{ env.OWNER }}/solar-spring-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push nginx image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/${{ env.OWNER }}/solar-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push all-in-one production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/thevoltaura-billing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger backend deploy hook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret set — skip PaaS deploy."
            echo "Create a free Render Web Service from Dockerfile and add the deploy hook to GitHub Secrets."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

      - name: Stop services
        if: always()
        run: docker compose down
