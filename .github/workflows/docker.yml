name: Docker Build & Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Buildx ───────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to GitHub Container Registry ─────────────────────────────────
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Create .env from GitHub Secrets ────────────────────────────────────
      - name: Write .env file
        run: |
          cat <<EOF > .env
          NODE_ENV=production
          PORT=5000
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          SPRING_PROFILES_ACTIVE=docker
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          EOF

      # ── Build all images ────────────────────────────────────────────────────
      - name: Build all Docker images
        run: docker compose build --no-cache

      # ── Smoke test: start and verify health ─────────────────────────────────
      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 90

      - name: Verify health endpoints
        run: |
          echo "=== Nginx ==="
          curl -f http://localhost/nginx-health
          echo ""
          echo "=== Node BFF ==="
          curl -f http://localhost/api/health
          echo ""
          echo "=== Spring Boot ==="
          curl -f http://localhost/spring/health
          echo ""
          echo "=== Frontend SPA ==="
          curl -f http://localhost | head -20

      - name: Container status
        if: always()
        run: docker compose ps

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

      # ── Push images to GHCR (main branch only) ─────────────────────────────
      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/solar-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push node-backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: node-backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/solar-node-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push spring-service image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./spring-microservice
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/solar-spring-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push nginx image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/solar-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Stop services
        if: always()
        run: docker compose down
