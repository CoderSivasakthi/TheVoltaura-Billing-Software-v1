worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Docker embedded DNS resolver ──────────────────────────────────────
    # Required so nginx resolves upstream hostnames per-request rather than
    # at startup time.  Without this directive nginx uses glibc/getaddrinfo
    # which is called once at startup; if any upstream host does not yet
    # exist in Docker's DNS (e.g. spring-service is not started), nginx
    # refuses to start entirely and the healthcheck never succeeds.
    # 127.0.0.11 is Docker's built-in DNS server present on every bridge
    # network.  valid=30s makes nginx re-resolve every 30 seconds so
    # container restarts are picked up automatically.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Gzip Compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Main Server Block ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security Headers ─────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Hide Nginx version
        server_tokens off;

        # Max upload size
        client_max_body_size 10M;

        # ── /api/* → Node BFF ─────────────────────────────────────────────
        # Variable proxy_pass so the hostname is resolved via Docker DNS
        # (127.0.0.11) at request time, not at nginx startup.
        location /api/ {
            set $node_backend "http://node-backend:5001";
            proxy_pass         $node_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # Remove internal headers from response
            proxy_hide_header X-Powered-By;
        }

        # ── /spring/* → Spring Boot ───────────────────────────────────────
        # Variable proxy_pass + rewrite to strip the /spring prefix.
        # Spring Boot registers its own context path, so /spring/health
        # must be forwarded as /spring/health (no stripping needed by nginx).
        location /spring/ {
            set $spring_backend "http://spring-service:8081";
            proxy_pass         $spring_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── / → React Frontend (SPA) ──────────────────────────────────────
        location / {
            set $frontend_app "http://frontend:80";
            proxy_pass         $frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;

            # Cache static assets at this layer
            proxy_cache_bypass $http_upgrade;
        }

        # ── Health check for the proxy itself ─────────────────────────────
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
