# Active when: SPRING_PROFILES_ACTIVE=docker
# Credentials come from environment variables. If SPRING_DATASOURCE_URL is unset,
# Spring Boot uses in-memory H2 so CI/smoke tests can start without secrets.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:solardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.hikari.pool-name=SolarFlow-Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.h2.console.enabled=false

server.port=8081

logging.level.com.solar=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
