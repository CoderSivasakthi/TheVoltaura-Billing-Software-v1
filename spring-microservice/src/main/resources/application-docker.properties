# ─────────────────────────────────────────────────────────────────────────────
# Solar Billing SaaS — Spring Boot Docker Profile
# Active when: SPRING_PROFILES_ACTIVE=docker
# All credentials come from environment variables (provided via .env)
# ─────────────────────────────────────────────────────────────────────────────

# ── Supabase PostgreSQL via Pooler ────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
spring.datasource.hikari.pool-name=SolarFlow-Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
# Required for Supabase PgBouncer in transaction mode
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.initialization-fail-timeout=-1

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── H2 Console disabled in production ─────────────────────────────────────────
spring.h2.console.enabled=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8081

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.solar=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
